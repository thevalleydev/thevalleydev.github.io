      <stop offset="0" stop-color="#2b2f5c"/>
      <stop offset="1" stop-color="#171a33"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6cf0"/>
      <stop offset="1" stop-color="#9b5cf0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="rotate(-10 30 32)">
    <rect x="14" y="7" width="30" height="50" rx="6.5" fill="#e9ebf5" stroke="#0f1126" stroke-width="1.4"/>
    <rect x="16.6" y="11" width="24.8" height="42" rx="4" fill="url(#screen)"/>
    <rect x="25" y="8.6" width="8" height="1.5" rx=".75" fill="#0f1126"/>
    <rect x="19" y="15" width="16" height="6" rx="3" fill="#fff" opacity=".95"/>
    <rect x="23" y="23.5" width="16" height="6" rx="3" fill="#7af0c1"/>
    <rect x="19" y="32" width="12" height="6" rx="3" fill="#fff" opacity=".95"/>
    <circle cx="22" cy="18" r="1" fill="#5a6cf0"/><circle cx="25" cy="18" r="1" fill="#5a6cf0"/><circle cx="28" cy="18" r="1" fill="#5a6cf0"/>
  </g>
  <g transform="translate(41 40)">
    <path d="M7 7 L15 15" stroke="#0f1126" stroke-width="6.4" stroke-linecap="round"/>
    <path d="M7 7 L15 15" stroke="#e0913a" stroke-width="4" stroke-linecap="round"/>
    <circle r="10" fill="#cfe6ff" fill-opacity=".35" stroke="#0f1126" stroke-width="5"/>
    <circle r="10" fill="none" stroke="#f2f4fb" stroke-width="2.6"/>
    <path d="M-5 -3.6 A6 6 0 0 1 -1.4 -6.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
