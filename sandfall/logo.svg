<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sandfall Mural: a pixel picture with one pixel missing; its sand trickles down into a pile. -->
  <rect width="64" height="64" rx="14" fill="#1c1e2b"/>
  <g shape-rendering="crispEdges">
    <rect x="10" y="9" width="44" height="9" fill="#8ccff0"/>
    <rect x="28" y="9" width="8" height="9" fill="#f6cf45"/>
    <rect x="10" y="18" width="44" height="9" fill="#f5923e"/>
    <rect x="19" y="18" width="26" height="9" fill="#f6cf45"/>
    <rect x="10" y="27" width="44" height="9" fill="#3b6fd8"/>
    <rect x="36" y="27" width="9" height="9" fill="#1c1e2b"/>
    <!-- falling grains -->
    <rect x="39" y="38" width="3" height="3" fill="#3b6fd8"/>
    <rect x="40" y="43" width="3" height="3" fill="#3b6fd8"/>
    <rect x="38" y="47" width="3" height="3" fill="#3b6fd8"/>
    <!-- the pile -->
    <rect x="37" y="51" width="6" height="2" fill="#3b6fd8"/>
    <rect x="34" y="53" width="13" height="2" fill="#3b6fd8"/>
    <rect x="31" y="55" width="19" height="2" fill="#3b6fd8"/>
  </g>
</svg>
