<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1e2b" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <title>Sandfall Mural (prototype)</title>
    <script type="module" crossorigin src="./assets/index-CKY0dgHs.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-vpSt3kDS.css">
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Sandfall Mural" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));</script>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="btn-levels" class="icon" aria-label="Levels and playtest log">☰</button>
        <button id="btn-daily" class="icon" aria-label="Today's Daily Mural">📅</button>
        <button id="btn-help" class="icon" aria-label="How to play">?</button>
        <div id="level-title"></div>
        <select id="rule-select" aria-label="Reach rule"></select>
        <button id="btn-sound" class="icon" aria-label="Sound on">🔊</button>
        <button id="btn-restart" class="icon" aria-label="Restart level">↻</button>
      </header>
      <main id="stage">
        <canvas id="board"></canvas>
        <canvas id="overlay"></canvas>
      </main>
      <div id="hud"><span id="hud-score"></span><span id="belt-count"></span></div>
      <section id="slots" aria-label="Holding slots"></section>
      <section id="lanes" aria-label="Waiting collectors"></section>
      <div id="modal" hidden><div id="modal-card"></div></div>
    </div>
  </body>
</html>
