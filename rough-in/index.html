<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf0dc" />
    <meta name="description" content="Plumb, wire and heat an old house, one tidy rotation puzzle at a time." />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <title>Rough-In</title>
    <script type="module" crossorigin src="./assets/index-DvoNzNVE.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-iGYUukRH.css">
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Rough-In" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));</script>
  </head>
  <body>
    <div id="app">
      <section id="home" hidden>
        <img class="logo" src="./logo.svg" alt="" width="96" height="96" />
        <h1>Rough-In</h1>
        <p class="tag">Plumb, wire and heat the old house, one tidy job at a time.</p>
        <button id="btn-daily" class="big primary">
          <span class="t">Daily repair <b id="daily-num"></b></span>
          <span class="s" id="daily-sub"></span>
        </button>
        <div id="rooms"></div>
        <div class="home-foot">
          <label class="toggle">Sound <input type="checkbox" id="opt-sound" /><span class="switch"></span></label>
          <p id="studio"></p>
        </div>
      </section>

      <section id="play" hidden>
        <header id="bar">
          <button id="btn-home" class="icon" aria-label="Back to the house">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L12 3 L21 11 M6 9 V20 H18 V9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="titles">
            <div id="job-title"></div>
            <div id="job-sub"></div>
          </div>
          <button id="btn-restart" class="icon" aria-label="Start this job over">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 A8 8 0 1 1 17.7 6.3 M20 4 V8 H16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </header>
        <div id="hud"><span id="hud-taps"></span><span id="hud-goal"></span></div>
        <div id="board-wrap"><div id="board"></div></div>
        <p id="hint"></p>
      </section>

      <section id="panel" hidden>
        <div class="card">
          <h2 id="panel-title"></h2>
          <div id="panel-body"></div>
          <div id="panel-buttons"></div>
        </div>
      </section>
      <div id="toast" hidden></div>
    </div>
  </body>
</html>
